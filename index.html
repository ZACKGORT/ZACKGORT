<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>zackgort.com — moving to zack.cx</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg: #0b0b0a;
    --bg-raised: #131211;
    --fg: #f2efe9;
    --muted: #85807a;
    --line: #26241f;
    --accent: #f2c230;
    --accent-dim: #6b5a1a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }

  .page {
    width: 100%;
    max-width: 640px;
  }

  /* faint scan texture behind everything, like an old CRT departures board */
  .board {
    position: relative;
    border: 1px solid var(--line);
    background: var(--bg-raised);
    border-radius: 2px;
    padding: 48px 40px 40px;
    overflow: hidden;
  }

  .board::before {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.015) 0px,
      rgba(255,255,255,0.015) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
  }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .eyebrow .old-domain {
    text-decoration: line-through;
    text-decoration-color: var(--accent-dim);
    color: var(--muted);
  }

  .eyebrow .arrow { color: var(--accent); }

  .eyebrow .new-domain {
    color: var(--fg);
  }

  h1 {
    font-family: 'Archivo Black', sans-serif;
    font-size: clamp(26px, 5vw, 38px);
    line-height: 1.15;
    margin: 18px 0 34px;
    font-weight: 400;
    letter-spacing: -0.01em;
  }

  h1 span {
    color: var(--accent);
  }

  a {
    color: var(--accent);
  }

  h1 a {
    color: var(--fg);
    text-decoration: none;
    background-image: linear-gradient(var(--accent), var(--accent));
    background-repeat: no-repeat;
    background-position: 0 100%;
    background-size: 100% 2px;
    padding-bottom: 2px;
    transition: background-size 0.2s ease, color 0.2s ease;
  }

  h1 a:hover {
    color: var(--accent);
    background-size: 100% 100%;
  }

  .fine-print a {
    color: var(--fg);
    text-decoration: underline;
    text-decoration-color: var(--accent-dim);
    text-underline-offset: 3px;
    transition: text-decoration-color 0.2s ease;
  }

  .fine-print a:hover {
    text-decoration-color: var(--accent);
  }

  /* --- odometer countdown --- */
  .odometer {
    display: flex;
    align-items: flex-end;
    gap: 18px;
    flex-wrap: wrap;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    padding: 28px 0;
    margin-bottom: 28px;
  }

  .unit {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .digits {
    display: flex;
    gap: 3px;
  }

  .digit-window {
    position: relative;
    width: 0.62em;
    height: 1em;
    overflow: hidden;
    font-family: 'Archivo Black', sans-serif;
    font-size: clamp(32px, 8vw, 52px);
    font-variant-numeric: tabular-nums;
    background: #000;
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 6px 4px;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.6);
  }

  .digit-strip {
    position: absolute;
    top: 6px;
    left: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
    transition: transform 0.5s cubic-bezier(.36,.66,.4,1);
  }

  .digit-strip span {
    height: 1em;
    line-height: 1em;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--fg);
  }

  .unit-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: center;
  }

  .colon {
    align-self: center;
    font-family: 'Archivo Black', sans-serif;
    font-size: clamp(24px, 6vw, 40px);
    color: var(--accent-dim);
    padding-bottom: 22px;
  }

  .fine-print {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 32px;
  }

  .fine-print strong { color: var(--fg); font-weight: 500; }

  .cta {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--accent);
    color: #0b0b0a;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    text-decoration: none;
    padding: 15px 22px;
    border-radius: 2px;
    transition: transform 0.15s ease, background 0.15s ease;
  }

  .cta:hover {
    background: #ffd766;
    transform: translateX(2px);
  }

  .cta svg { transition: transform 0.15s ease; }
  .cta:hover svg { transform: translateX(3px); }

  .footer-note {
    margin-top: 22px;
    font-size: 12px;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
  }

  .expired h1 span { color: #5fbf7a; }
  .expired .digit-window { border-color: #2a3a2c; }

  @media (max-width: 420px) {
    .board { padding: 34px 22px 28px; }
    .odometer { gap: 10px; }
    .colon { padding-bottom: 14px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .digit-strip { transition: none; }
  }
</style>
</head>
<body>

<div class="page">
  <div class="board" id="board">
    <div class="eyebrow">
      <span class="old-domain">zackgort.com</span>
      <span class="arrow">→</span>
      <span class="new-domain">zack.cx</span>
    </div>

    <h1>zackgort.com to be <span>decommissioned.</span><br><br>now, just <a href="https://www.zack.cx">zack.cx</a></h1>

    <div class="odometer" id="odometer">
      <!-- filled by JS -->
    </div>

    <p class="fine-print" id="finePrint">
      <strong>zackgort.com</strong> stops renewing on <strong>Aug 10, 2026</strong>. Bookmarks, old links, and search results pointing here will eventually go dark — update them now.
    </p>

    <a class="cta" href="https://zack.cx" target="_blank" rel="noopener">
      Go to zack.cx
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 8H13M13 8L9 4M13 8L9 12" stroke="#0b0b0a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>

    <div class="footer-note">Zack Gort · Senior UX / Product Designer</div>
  </div>
</div>

<script>
  const TARGET = new Date('2026-08-10T00:00:00');

  const units = [
    { key: 'days',    label: 'Days',    digits: 3 },
    { key: 'hours',   label: 'Hours',   digits: 2 },
    { key: 'minutes', label: 'Mins',    digits: 2 },
    { key: 'seconds', label: 'Secs',    digits: 2 },
  ];

  const odometer = document.getElementById('odometer');

  function buildStrip(digit) {
    const strip = document.createElement('div');
    strip.className = 'digit-strip';
    for (let i = 0; i < 10; i++) {
      const s = document.createElement('span');
      s.textContent = i;
      strip.appendChild(s);
    }
    return strip;
  }

  const digitEls = {}; // key -> array of {window, strip}

  units.forEach((u, idx) => {
    const unitEl = document.createElement('div');
    unitEl.className = 'unit';

    const digitsEl = document.createElement('div');
    digitsEl.className = 'digits';

    digitEls[u.key] = [];

    for (let d = 0; d < u.digits; d++) {
      const win = document.createElement('div');
      win.className = 'digit-window';
      const strip = buildStrip();
      win.appendChild(strip);
      digitsEl.appendChild(win);
      digitEls[u.key].push(strip);
    }

    const labelEl = document.createElement('div');
    labelEl.className = 'unit-label';
    labelEl.textContent = u.label;

    unitEl.appendChild(digitsEl);
    unitEl.appendChild(labelEl);
    odometer.appendChild(unitEl);

    if (idx < units.length - 1) {
      const colon = document.createElement('div');
      colon.className = 'colon';
      colon.textContent = ':';
      odometer.appendChild(colon);
    }
  });

  function setDigit(strip, digit) {
    strip.style.transform = `translateY(-${digit}em)`;
  }

  function render() {
    const now = new Date();
    let diff = Math.max(0, TARGET - now);

    if (diff <= 0) {
      document.getElementById('board').classList.add('expired');
      document.querySelector('h1').innerHTML = '<span>zackgort.com</span> has been retired.<br>Find everything at zack.cx now.';
      document.getElementById('finePrint').innerHTML = 'This domain is no longer maintained. <strong>zack.cx</strong> is the current home for all work, writing, and contact info.';
    }

    const totalSeconds = Math.floor(diff / 1000);
    const days = Math.floor(totalSeconds / 86400);
    const hours = Math.floor((totalSeconds % 86400) / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    const values = { days, hours, minutes, seconds };

    units.forEach(u => {
      const str = String(values[u.key]).padStart(u.digits, '0');
      digitEls[u.key].forEach((strip, i) => {
        setDigit(strip, Number(str[i]));
      });
    });
  }

  render();
  setInterval(render, 1000);
</script>

</body>
</html>
